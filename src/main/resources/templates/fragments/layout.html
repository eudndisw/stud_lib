<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Спільний <head>: ~{fragments/layout :: head('Назва сторінки')} -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Студентська бібліотека'">Студентська бібліотека</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<!-- Навігація з розмежуванням за ролями -->
<nav th:fragment="navbar" class="navbar navbar-expand-md navbar-dark navbar-lib">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Студентська бібліотека</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Меню">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/books}">Каталог</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/profile}">Мої книги</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">
                    <a class="nav-link" th:href="@{/issues}">Видачі</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">
                    <a class="nav-link" th:href="@{/users}">Читачі</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">
                    <a class="nav-link" th:href="@{/authors}">Автори</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')">
                    <a class="nav-link" th:href="@{/categories}">Категорії</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex align-items-center gap-3 mb-0"
                  sec:authorize="isAuthenticated()">
                <span class="navbar-text" sec:authentication="name">user</span>
                <button type="submit" class="btn btn-sm btn-outline-light">Вийти</button>
            </form>
        </div>
    </div>
</nav>

<!-- Flash-повідомлення про результат операції -->
<div th:fragment="flash">
    <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
</div>

<!-- Пагінація: ~{fragments/layout :: pager(${page}, '/books', ${q}, ${sort}, ${dir})} -->
<th:block th:fragment="pager(page, basePath, q, sort, dir)">
    <nav th:if="${page.totalPages > 1}" aria-label="Сторінки" class="mt-3">
        <ul class="pagination pagination-sm justify-content-center mb-0">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{${basePath}(q=${q},sort=${sort},dir=${dir},size=${page.size},page=${page.number - 1})}">&laquo;</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:if="${i == 0 or i == page.totalPages - 1 or (i >= page.number - 2 and i <= page.number + 2)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link"
                   th:href="@{${basePath}(q=${q},sort=${sort},dir=${dir},size=${page.size},page=${i})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{${basePath}(q=${q},sort=${sort},dir=${dir},size=${page.size},page=${page.number + 1})}">&raquo;</a>
            </li>
        </ul>
    </nav>
</th:block>
</body>
</html>
