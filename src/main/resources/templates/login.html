<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вхід')}"></head>
<body>
<main class="container">
    <div class="login-box">
        <h1 class="page-title text-center">Студентська бібліотека</h1>
        <div th:if="${param.error}" class="alert alert-danger" role="alert">Невірний email або пароль</div>
        <div th:if="${param.logout}" class="alert alert-success" role="alert">Ви вийшли з системи</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Email</label>
                <input id="username" type="email" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input id="password" type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-lib w-100">Увійти</button>
        </form>
    </div>
</main>
</body>
</html>
