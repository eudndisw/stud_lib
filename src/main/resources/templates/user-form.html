<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 640px;">
    <h1 class="page-title" th:text="${pageTitle}">Новий читач</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <form th:action="@{${formAction}}" th:object="${form}" method="post" novalidate>
        <div class="row g-3 mb-3">
            <div class="col-6">
                <label for="firstName" class="form-label">Ім’я</label>
                <input type="text" th:field="*{firstName}" class="form-control"
                       th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{firstName}">Помилка</div>
            </div>
            <div class="col-6">
                <label for="lastName" class="form-label">Прізвище</label>
                <input type="text" th:field="*{lastName}" class="form-control"
                       th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{lastName}">Помилка</div>
            </div>
        </div>
        <div class="mb-3">
            <label for="groupName" class="form-label">Академічна група</label>
            <input type="text" th:field="*{groupName}" class="form-control" placeholder="Наприклад, ІО-45">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email (логін)</label>
            <input type="email" th:field="*{email}" class="form-control"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{email}">Помилка</div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" th:field="*{password}" class="form-control" autocomplete="new-password">
            <div class="form-text" th:if="${creating}">Мінімум 6 символів.</div>
            <div class="form-text" th:unless="${creating}">Залиште порожнім, щоб не змінювати пароль.</div>
        </div>
        <div class="mb-4">
            <label for="roleId" class="form-label">Роль</label>
            <select th:field="*{roleId}" class="form-select"
                    th:classappend="${#fields.hasErrors('roleId')} ? 'is-invalid'">
                <option value="">— оберіть —</option>
                <option th:each="r : ${roles}" th:value="${r.roleId}"
                        th:text="${r.roleName == 'ADMIN' ? 'Адміністратор' : (r.roleName == 'LIBRARIAN' ? 'Бібліотекар' : 'Студент')}">Роль</option>
            </select>
            <div class="invalid-feedback" th:errors="*{roleId}">Помилка</div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-lib">Зберегти</button>
            <a class="btn btn-outline-dark" th:href="@{/users}">Скасувати</a>
        </div>
    </form>
</main>
</body>
</html>
