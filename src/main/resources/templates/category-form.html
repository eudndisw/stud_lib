<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 560px;">
    <h1 class="page-title" th:text="${pageTitle}">Нова категорія</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <form th:action="@{${formAction}}" th:object="${form}" method="post" novalidate>
        <div class="mb-4">
            <label for="categoryName" class="form-label">Назва категорії</label>
            <input type="text" th:field="*{categoryName}" class="form-control"
                   th:classappend="${#fields.hasErrors('categoryName')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{categoryName}">Помилка</div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-lib">Зберегти</button>
            <a class="btn btn-outline-dark" th:href="@{/categories}">Скасувати</a>
        </div>
    </form>
</main>
</body>
</html>
