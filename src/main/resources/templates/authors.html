<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Автори')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="page-title">Автори</h1>
    <table class="table table-striped bg-white">
        <thead><tr><th>ID</th><th>Ім’я</th><th>Прізвище</th></tr></thead>
        <tbody>
            <tr th:each="author : ${authors}">
                <td th:text="${author.authorId}">1</td>
                <td th:text="${author.firstName}">Роберт</td>
                <td th:text="${author.lastName}">Мартін</td>
            </tr>
            <tr th:if="${#lists.isEmpty(authors)}"><td colspan="3" class="text-muted">Авторів ще немає.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
