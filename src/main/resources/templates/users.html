<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Читачі')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="page-title mb-0">Список читачів</h1>
        <a class="btn btn-lib" th:href="@{/users/new}" sec:authorize="hasRole('ADMIN')">Додати читача</a>
    </div>

    <form th:action="@{/users}" method="get" class="row g-2 mb-3 align-items-end">
        <div class="col-md-5">
            <label for="q" class="form-label">Пошук</label>
            <input id="q" name="q" type="search" class="form-control" th:value="${q}"
                   placeholder="Ім’я, прізвище, група або email">
        </div>
        <div class="col-md-3">
            <label for="sort" class="form-label">Сортувати за</label>
            <select id="sort" name="sort" class="form-select">
                <option value="lastName" th:selected="${sort == 'lastName'}">Прізвищем</option>
                <option value="firstName" th:selected="${sort == 'firstName'}">Іменем</option>
                <option value="groupName" th:selected="${sort == 'groupName'}">Групою</option>
            </select>
        </div>
        <div class="col-md-2">
            <label for="dir" class="form-label">Порядок</label>
            <select id="dir" name="dir" class="form-select">
                <option value="asc" th:selected="${dir == 'asc'}">За зростанням</option>
                <option value="desc" th:selected="${dir == 'desc'}">За спаданням</option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-lib w-100">Знайти</button>
        </div>
    </form>

    <p class="text-muted small mb-2">Знайдено: <span th:text="${users.totalElements}">0</span></p>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>Ім’я</th>
                <th>Прізвище</th>
                <th>Група</th>
                <th>Email</th>
                <th>Роль</th>
                <th sec:authorize="hasRole('ADMIN')"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users.content}">
                <td th:text="${user.firstName}">Іван</td>
                <td th:text="${user.lastName}">Петренко</td>
                <td th:text="${user.groupName != null} ? ${user.groupName} : '—'">ІО-45</td>
                <td th:text="${user.email}">student@library.com</td>
                <td th:text="${user.role.roleName}">STUDENT</td>
                <td class="text-end text-nowrap" sec:authorize="hasRole('ADMIN')">
                    <a class="btn btn-sm btn-outline-dark" th:href="@{/users/{id}/edit(id=${user.userId})}">Редагувати</a>
                    <form th:action="@{/users/{id}/delete(id=${user.userId})}" method="post" class="d-inline"
                          onsubmit="return confirm('Видалити цього читача?');">
                        <button type="submit" class="btn btn-sm btn-outline-dark">Видалити</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${users.empty}">
                <td colspan="6" class="text-muted">Нічого не знайдено.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/layout :: pager(${users}, '/users', ${q}, ${sort}, ${dir})}"></div>
</main>
</body>
</html>
