<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Категорії')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="page-title">Категорії</h1>
    <table class="table table-striped bg-white">
        <thead><tr><th>ID</th><th>Назва</th></tr></thead>
        <tbody>
            <tr th:each="category : ${categories}">
                <td th:text="${category.categoryId}">1</td>
                <td th:text="${category.categoryName}">Програмування</td>
            </tr>
            <tr th:if="${#lists.isEmpty(categories)}"><td colspan="2" class="text-muted">Категорій ще немає.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
