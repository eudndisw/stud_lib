services:
  db:
    image: postgres:15
    container_name: student-library-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student_library
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/db_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  pgdata: